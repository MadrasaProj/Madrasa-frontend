<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>19 · Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background:#e5e7eb; }
  .hero {
    background: linear-gradient(135deg, #047857 0%, #0d9488 100%);
    color:#fff; padding: 32px 20px 24px;
    text-align: center; position: relative; overflow: hidden;
  }
  .hero::after {
    content: ''; position: absolute; right: -30px; top: -30px;
    width: 200px; height: 200px; border-radius: 9999px;
    background: radial-gradient(circle, rgba(255,255,255,.15), transparent 70%);
  }
  .hero .avatar-xl {
    width: 88px; height: 88px; border-radius: 9999px; margin: 0 auto 12px;
    background: rgba(255,255,255,.2); display:grid; place-items:center;
    font-size: 32px; font-weight: 900; color:#fff;
    border: 4px solid rgba(255,255,255,.3);
    animation: scaleIn .5s .2s both;
  }
  .hero h1 { font-size: 20px; font-weight: 800; animation: fadeUp .4s .4s both; }
  .hero p  { font-size: 12px; opacity: .85; margin-top: 2px; animation: fadeUp .4s .5s both; }
  .hero .pill {
    display:inline-flex; align-items:center; gap: 4px;
    background: rgba(255,255,255,.2); padding: 4px 12px; border-radius: 9999px;
    font-size: 11px; font-weight: 700; margin-top: 10px;
    animation: fadeUp .4s .6s both;
  }

  .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
           padding: 0 16px; margin-top: -16px; }
  .stat-card {
    background: #fff; padding: 12px 8px; border-radius: var(--r-xl);
    text-align: center; box-shadow: var(--sh-md);
    animation: fadeUp .4s .7s both;
  }
  .stat-card:nth-child(2) { animation-delay: .8s; }
  .stat-card:nth-child(3) { animation-delay: .9s; }
  .stat-card .v { font-size: 20px; font-weight: 900; color: var(--emerald-600); }
  .stat-card .l { font-size: 9px; color: var(--gray-500); text-transform: uppercase; letter-spacing: 1px; }

  .info-card {
    background: #fff; margin: 16px; padding: 14px;
    border-radius: var(--r-2xl); box-shadow: var(--sh-sm);
  }
  .info-card h4 { font-size: 12px; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .info-row { display:flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--gray-100); }
  .info-row:last-child { border: 0; }
  .info-row .ib { width: 32px; height: 32px; border-radius: 8px; background: var(--emerald-50); color: var(--emerald-600);
                  display:grid; place-items:center; }
  .info-row .k { font-size: 11px; color: var(--gray-500); }
  .info-row .v { font-size: 13px; font-weight: 600; }
  .sign-out {
    margin: 16px; padding: 12px; border-radius: var(--r-md);
    background: #fff; color: var(--red-600); border: 1px solid var(--red-200);
    text-align: center; font-weight: 700; font-size: 13px;
    display:flex; align-items: center; justify-content: center; gap: 8px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="phone-inner">
      <div class="scroll">
        <div class="hero">
          <div class="avatar-xl">A</div>
          <h1>Ustadha Ayesha</h1>
          <p>Class Teacher · 7-A</p>
          <span class="pill">
            <svg data-icon="check-circle-2" data-size="12"></svg>
            Al-Madina Madrasa
          </span>
        </div>

        <div class="stats">
          <div class="stat-card"><div class="v">5</div><div class="l">Years</div></div>
          <div class="stat-card"><div class="v">30</div><div class="l">Students</div></div>
          <div class="stat-card"><div class="v">96%</div><div class="l">Att.</div></div>
        </div>

        <div class="info-card">
          <h4>Personal</h4>
          <div class="info-row">
            <div class="ib"><svg data-icon="user" data-size="16"></svg></div>
            <div><div class="k">Full name</div><div class="v">Ayesha Siddiqui</div></div>
          </div>
          <div class="info-row">
            <div class="ib"><svg data-icon="languages" data-size="16"></svg></div>
            <div><div class="k">Languages</div><div class="v">English, മലയാളം, العربية</div></div>
          </div>
          <div class="info-row">
            <div class="ib"><svg data-icon="bell" data-size="16"></svg></div>
            <div><div class="k">Subjects</div><div class="v">Quran, Islamic Studies</div></div>
          </div>
        </div>

        <div class="info-card">
          <h4>Account</h4>
          <div class="info-row">
            <div class="ib"><svg data-icon="settings" data-size="16"></svg></div>
            <div><div class="k">Preferences</div><div class="v">Language, notifications</div></div>
          </div>
          <div class="info-row">
            <div class="ib"><svg data-icon="languages" data-size="16"></svg></div>
            <div><div class="k">Language</div><div class="v">English</div></div>
          </div>
        </div>

        <button class="sign-out">
          <svg data-icon="log-out" data-size="14"></svg> Sign out
        </button>

        <nav class="bottom-nav">
          <div class="item"><svg data-icon="menu"></svg><span>Home</span></div>
          <div class="item"><svg data-icon="clipboard-list"></svg><span>Attend</span></div>
          <div class="item"><svg data-icon="book-open"></svg><span>HW</span></div>
          <div class="item"><svg data-icon="graduation-cap"></svg><span>Exams</span></div>
          <div class="item active"><svg data-icon="user"></svg><span>Me</span></div>
        </nav>
      </div>
    </div>
  </div>
</div>
<script src="icons.js"></script>
</body>
</html>
