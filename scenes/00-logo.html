<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>00 · Cold Open — Smart Madrasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=EB+Garamond:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #064e3b; overflow: hidden; }
  .stage { background: radial-gradient(ellipse at center, #065f46 0%, #022c22 100%) !important; }
  .wrap {
    width: 100vw; height: 100vh;
    display: grid; place-items: center; position: relative;
  }
  .mosaic {
    position: absolute; inset: 0; opacity: 0.05;
    background-image:
      linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .mark {
    width: 180px; height: 180px; border-radius: 48px;
    background: var(--grad-logo);
    display: grid; place-items: center;
    box-shadow: 0 30px 80px rgba(16,185,129,.35), inset 0 1px 0 rgba(255,255,255,.25);
    animation: pop .8s cubic-bezier(.34,1.56,.64,1) .3s both, float 4s ease-in-out 1.2s infinite;
  }
  @keyframes float { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }
  .mark svg { width: 96px; height: 96px; color: #fff; }
  .title { color:#fff; text-align: center; margin-top: 40px; }
  .title h1 { font-size: 76px; font-weight: 900; letter-spacing: -2px; animation: fadeUp .7s .9s both; }
  .title p  { font-size: 18px; opacity: .7; margin-top: 6px; letter-spacing: 6px; text-transform: uppercase; animation: fadeUp .7s 1.1s both; }
  .ring {
    position: absolute; border: 2px solid rgba(16,185,129,.4); border-radius: 50%;
    animation: ring 3s ease-out infinite;
  }
  .ring.r1 { width: 240px; height: 240px; animation-delay: 0s; }
  .ring.r2 { width: 320px; height: 320px; animation-delay: .5s; }
  .ring.r3 { width: 400px; height: 400px; animation-delay: 1s; }
  @keyframes ring {
    0%   { transform: scale(.8); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .sub {
    position: absolute; bottom: 60px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,.4); font-size: 13px; letter-spacing: 4px;
    animation: fadeIn 1s 1.4s both;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mosaic"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div style="text-align:center;">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <!-- mosque dome glyph -->
        <path d="M12 2c-3 0-5.5 2.5-5.5 5.5V8H5v3H3v9h18v-9h-2V8h-1.5V7.5C17.5 4.5 15 2 12 2zm-3.5 6.5V7.5C8.5 5.6 10.1 4 12 4s3.5 1.6 3.5 3.5V8.5h-7zM10 13h4v6h-4z"/>
        <rect x="9" y="14" width="6" height="2" fill="#047857"/>
      </svg>
    </div>
    <div class="title">
      <h1>Smart Madrasa</h1>
      <p>Teacher Portal</p>
    </div>
  </div>
  <div class="sub">EN · ML  ·  PWA  ·  MULTI-TENANT</div>
</div>
<script src="icons.js"></script>
<script src="_frame.js"></script>
</body>
</html>
