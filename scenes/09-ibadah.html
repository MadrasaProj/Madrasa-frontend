<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>09 · Ibadah Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background:#e5e7eb; }
  .tabs { display:flex; gap: 4px; padding: 12px 16px; }
  .tab {
    flex: 1; padding: 8px; border-radius: var(--r-md);
    background: var(--gray-100); color: var(--gray-500);
    font-size: 12px; font-weight: 700; text-align: center;
  }
  .tab.on { background: var(--emerald-600); color:#fff; }

  .chips { display:flex; gap: 8px; padding: 0 16px 12px; overflow-x:auto; }
  .chip {
    padding: 7px 14px; border-radius: var(--r-md); font-size: 12px; font-weight: 700;
    white-space: nowrap; border:1px solid var(--gray-200); background:#fff; color: var(--gray-600);
  }
  .chip.on { background: var(--emerald-600); color:#fff; border-color: var(--emerald-600); }

  .date-bar {
    display:flex; align-items:center; gap: 6px; padding: 0 16px 12px;
    color: var(--emerald-800); font-size: 12px; font-weight: 700;
  }

  .grid-card {
    background: #fff; border-radius: var(--r-2xl); margin: 0 16px 100px;
    box-shadow: var(--sh-sm); overflow: hidden;
  }
  .gh { display:grid; grid-template-columns: 1.6fr repeat(5, 1fr) 1fr 1fr; gap: 4px;
        padding: 10px 12px; background: var(--gray-50); font-size: 10px;
        color: var(--gray-500); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .row { display:grid; grid-template-columns: 1.6fr repeat(5, 1fr) 1fr 1fr; gap: 4px;
         padding: 10px 12px; align-items: center; border-bottom: 1px solid var(--gray-100);
         animation: fadeUp .3s both; }
  .row:last-child { border-bottom: 0; }
  .row .name { display:flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .cell {
    display:grid; place-items: center; height: 28px; border-radius: 6px;
    background: var(--gray-100); color: var(--gray-400);
  }
  .cell.on { background: var(--emerald-100); color: var(--emerald-700); animation: pop .3s both; }
  .q-cell { font-size: 11px; font-weight: 700; color: var(--emerald-700); text-align: center; }
  .legend { display:flex; gap: 12px; padding: 10px 16px; font-size: 10px; color: var(--gray-500); }
  .legend .item { display:flex; align-items: center; gap: 4px; }
  .legend .sw { width: 14px; height: 14px; border-radius: 4px; background: var(--emerald-100); }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="phone-inner">
      <div class="scroll">
        <div class="header-row">
          <div class="back"><svg data-icon="chevron-left"></svg></div>
          <div class="title-block">
            <h1>Ibadah Tracker</h1>
            <p>5 prayers · Quran · deeds</p>
          </div>
        </div>

        <div class="tabs">
          <div class="tab on">Prayers</div>
          <div class="tab">Quran</div>
          <div class="tab">Custom</div>
        </div>

        <div class="chips">
          <div class="chip on">7-A</div>
          <div class="chip">7-B</div>
          <div class="chip">8-A</div>
        </div>

        <div class="date-bar">
          <svg data-icon="calendar" data-size="14"></svg>
          <span>Mon · 29 Jun 2026</span>
          <span style="margin-left:auto; color: var(--emerald-600); font-size: 11px;">22 / 30 ✓</span>
        </div>

        <div class="grid-card">
          <div class="gh">
            <div>Student</div>
            <div style="text-align:center;">F</div>
            <div style="text-align:center;">D</div>
            <div style="text-align:center;">A</div>
            <div style="text-align:center;">M</div>
            <div style="text-align:center;">I</div>
            <div style="text-align:center;">Qur'an</div>
            <div style="text-align:center;">Deeds</div>
          </div>
          <div id="rows"></div>
        </div>

        <div class="legend">
          <div class="item"><div class="sw"></div> All 5 prayers</div>
          <div class="item"><div class="sw" style="background: var(--emerald-500);"></div> 1+</div>
          <div class="item"><div class="sw" style="background: var(--gray-200);"></div> None</div>
        </div>

        <nav class="bottom-nav">
          <div class="item"><svg data-icon="menu"></svg><span>Home</span></div>
          <div class="item"><svg data-icon="clipboard-list"></svg><span>Attend</span></div>
          <div class="item"><svg data-icon="moon" data-size="20" style="color: var(--emerald-600);"></svg><span style="color: var(--emerald-600);">Ibadah</span></div>
          <div class="item"><svg data-icon="graduation-cap"></svg><span>Exams</span></div>
          <div class="item"><svg data-icon="more-vertical"></svg><span>More</span></div>
        </nav>
      </div>
    </div>
  </div>
</div>
<script src="icons.js"></script>
<script>
  const students = [
    ["Ahmad Raza","m"], ["Fatima Zahra","f"], ["Yusuf Ibrahim","m"],
    ["Maryam Sadiq","f"], ["Omar Farooq","m"], ["Aisha Siddiqui","f"],
    ["Hassan Ali","m"], ["Khadija Bibi","f"],
  ];
  // varied: [F, D, A, M, I] — some full, some partial
  const data = [
    [1,1,1,1,1, 4, 3], [1,1,1,1,0, 3, 2], [1,1,1,0,0, 2, 1],
    [1,1,1,1,1, 5, 4], [1,0,1,0,0, 1, 0], [1,1,1,1,1, 4, 3],
    [1,1,0,1,0, 2, 1], [1,1,1,1,1, 5, 4],
  ];
  const rows = document.getElementById("rows");
  students.forEach(([n,g], i) => {
    const init = n.split(" ").map(x=>x[0]).slice(0,2).join("");
    const r = document.createElement("div");
    r.className = "row";
    r.style.animationDelay = (0.3 + i*0.1) + "s";
    const d = data[i];
    r.innerHTML = `
      <div class="name">
        <div class="avatar ${g}" style="width:24px; height:24px; font-size:9px;">${init}</div>
        <span>${n}</span>
      </div>
      ${d.slice(0,5).map(v => `<div class="cell ${v?'on':''}" data-delay="${i*80 + 600}">${v?'✓':''}</div>`).join("")}
      <div class="q-cell">${d[5]}</div>
      <div class="q-cell">${d[6]}</div>`;
    rows.appendChild(r);
  });
</script>
</body>
</html>
