<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>20 · Close</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #064e3b; }
  .stage { background: radial-gradient(ellipse at center, #065f46 0%, #022c22 100%) !important; }
  .wrap {
    width: 100%; height: 100%;
    display: grid; place-items: center; position: relative;
    text-align: center; color:#fff; padding: 40px;
  }
  .mosaic {
    position: absolute; inset: 0; opacity: 0.05;
    background-image:
      linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .mark {
    width: 120px; height: 120px; border-radius: 28px;
    background: var(--grad-logo);
    display: grid; place-items: center;
    box-shadow: 0 20px 60px rgba(16,185,129,.4);
    margin-bottom: 32px;
    animation: pop .7s .2s cubic-bezier(.34,1.56,.64,1) both;
  }
  .mark svg { width: 64px; height: 64px; color:#fff; }

  .tag {
    font-size: 42px; font-weight: 900; letter-spacing: -1px; line-height: 1.1;
    animation: fadeUp .6s .6s both;
  }
  .tag span { color: #6ee7b7; }
  .sub {
    font-size: 15px; opacity: .75; margin-top: 16px;
    max-width: 480px; line-height: 1.5;
    animation: fadeUp .6s .8s both;
  }
  .url {
    margin-top: 36px; display:inline-block;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    padding: 10px 20px; border-radius: 9999px;
    font-size: 14px; font-family: 'Inter', monospace;
    animation: fadeUp .6s 1s both;
  }
  .url b { color: #6ee7b7; }

  .pills { display:flex; gap: 8px; justify-content: center; margin-top: 28px;
           animation: fadeUp .6s 1.1s both; }
  .pill {
    display:inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.08); padding: 8px 14px; border-radius: 9999px;
    font-size: 12px; font-weight: 600; opacity: .8;
  }
  .pill svg { width: 14px; height: 14px; }

  .ring {
    position: absolute; border: 2px solid rgba(16,185,129,.4); border-radius: 50%;
    animation: ring 3s ease-out infinite;
  }
  .ring.r1 { width: 200px; height: 200px; animation-delay: 0s; }
  .ring.r2 { width: 280px; height: 280px; animation-delay: .5s; }
  .ring.r3 { width: 360px; height: 360px; animation-delay: 1s; }
  @keyframes ring {
    0%   { transform: scale(.8); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .credit {
    position: absolute; bottom: 30px; left: 0; right: 0;
    font-size: 11px; opacity: .4; letter-spacing: 3px;
    animation: fadeIn 1s 1.5s both;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mosaic"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>

  <div class="mark">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2c-3 0-5.5 2.5-5.5 5.5V8H5v3H3v9h18v-9h-2V8h-1.5V7.5C17.5 4.5 15 2 12 2zm-3.5 6.5V7.5C8.5 5.6 10.1 4 12 4s3.5 1.6 3.5 3.5V8.5h-7zM10 13h4v6h-4z"/>
    </svg>
  </div>

  <div class="tag">Teach the deen.<br/><span>We handle the data.</span></div>
  <p class="sub">Smart Madrasa — the all-in-one platform for teachers, parents, and admins of every madrasa.</p>

  <div class="url">madrasa.app/m/<b>al-madina</b>/teacher</div>

  <div class="pills">
    <div class="pill">
      <svg data-icon="languages" data-size="14"></svg> EN · മല
    </div>
    <div class="pill">
      <svg data-icon="check-circle-2" data-size="14"></svg> PWA
    </div>
    <div class="pill">
      <svg data-icon="save" data-size="14"></svg> Offline-first
    </div>
  </div>

  <div class="credit">BUILT FOR KERALA · READY FOR THE WORLD</div>
</div>
<script src="icons.js"></script>
</body>
</html>
